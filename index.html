<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>City Transit Mockup</title>
    <style>
      :root {
        --nav: #1d3d95;
        --yellow-top: #ffd152;
        --yellow-bottom: #f5a623;
        --blue-top: #3c9ee1;
        --blue-bottom: #0070cd;
        --green-top: #5cff6e;
        --green-bottom: #26d94a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: #111;
      }

      .phone {
        width: min(100%, 390px);
        height: 100%;
        margin: 0 auto;
        background: #fff;
        overflow: hidden;
        position: relative;
      }

      .screen {
        display: none;
        height: 100%;
        flex-direction: column;
      }

      .screen.active {
        display: flex;
      }

      /* Home */
      .home {
        background: #f2f4f8;
      }

      .home-header {
        background: var(--nav);
        color: #fff;
        padding: calc(12px + env(safe-area-inset-top)) 20px 20px;
      }

      .home-header h1 {
        font-size: 28px;
        font-weight: 800;
      }

      .home-header p {
        margin-top: 4px;
        opacity: 0.85;
        font-size: 14px;
      }

      .home-body {
        padding: 20px;
      }

      .section-label {
        font-size: 13px;
        font-weight: 700;
        color: #5a6475;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      .ticket-card {
        display: flex;
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        border: none;
        width: 100%;
        text-align: left;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      }

      .ticket-card:active {
        opacity: 0.88;
      }

      .ticket-accent {
        width: 8px;
        background: var(--yellow-bottom);
      }

      .ticket-body {
        padding: 18px 16px;
      }

      .ticket-brand {
        color: var(--nav);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1.5px;
      }

      .ticket-title {
        font-size: 20px;
        font-weight: 800;
        margin-top: 4px;
      }

      .ticket-hint {
        color: #7a8494;
        font-size: 13px;
        margin-top: 8px;
      }

      /* Ticket screen */
      .ticket {
        background: var(--nav);
        color: #fff;
      }

      .nav-bar {
        background: var(--nav);
        padding-top: env(safe-area-inset-top);
      }

      .nav-inner {
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
      }

      .nav-inner button {
        background: none;
        border: none;
        color: #fff;
        font-size: 17px;
        min-width: 56px;
        text-align: left;
        cursor: pointer;
      }

      .nav-inner h2 {
        font-size: 17px;
        font-weight: 600;
      }

      .nav-spacer {
        min-width: 56px;
      }

      .band {
        position: relative;
        display: flex;
        flex-direction: column;
      }

      .band-top,
      .band-bottom {
        flex: 1;
      }

      .yellow-top {
        background: var(--yellow-top);
      }

      .yellow-bottom {
        background: var(--yellow-bottom);
      }

      .band-text {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .metro {
        height: 100px;
      }

      .metro-text {
        font-size: 42px;
        font-weight: 800;
        letter-spacing: 2px;
      }

      .divider {
        height: 1.5px;
        background: rgba(255, 255, 255, 0.95);
      }

      .ticket-area {
        flex: 1;
        position: relative;
        overflow: hidden;
        border: none;
        padding: 0;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        width: 100%;
      }

      .ticket-area.blue .band-top {
        background: var(--blue-top);
      }

      .ticket-area.blue .band-bottom {
        background: var(--blue-bottom);
      }

      .ticket-area.green .band-top {
        background: var(--green-top);
      }

      .ticket-area.green .band-bottom {
        background: var(--green-bottom);
      }

      .logos {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .logo {
        position: absolute;
        left: -8%;
        bottom: -12%;
        width: 42%;
        opacity: 0.48;
        animation: drift 18s linear infinite;
      }

      .logo:nth-child(2) {
        animation-delay: -6s;
      }

      .logo:nth-child(3) {
        animation-delay: -12s;
      }

      @keyframes drift {
        from {
          transform: translate(0, 0);
        }
        to {
          transform: translate(78%, -118%);
        }
      }

      .fare {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 800;
        pointer-events: none;
      }

      .expiration {
        height: calc(120px + env(safe-area-inset-bottom));
        padding-bottom: env(safe-area-inset-bottom);
      }

      .exp-time {
        font-size: 26px;
        font-weight: 800;
      }

      .exp-label {
        font-size: 15px;
        font-weight: 600;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <section id="home" class="screen home active">
        <header class="home-header">
          <h1>Transit Go</h1>
          <p>Ticket UI Prototype</p>
        </header>
        <div class="home-body">
          <div class="section-label">Your Tickets</div>
          <button class="ticket-card" id="openTicket" type="button">
            <span class="ticket-accent"></span>
            <span class="ticket-body">
              <div class="ticket-brand">METRO</div>
              <div class="ticket-title">ADULT ($3.00)</div>
              <div class="ticket-hint">Tap to view ticket</div>
            </span>
          </button>
        </div>
      </section>

      <section id="ticket" class="screen ticket">
        <div class="nav-bar">
          <div class="nav-inner">
            <button id="backBtn" type="button">Back</button>
            <h2>Ticket</h2>
            <span class="nav-spacer"></span>
          </div>
        </div>

        <div class="band metro">
          <div class="band-top yellow-top"></div>
          <div class="band-bottom yellow-bottom"></div>
          <div class="band-text metro-text">METRO</div>
        </div>
        <div class="divider"></div>

        <button class="ticket-area blue" id="ticketArea" type="button">
          <div class="band-top"></div>
          <div class="band-bottom"></div>
          <div class="logos">
            <img class="logo" src="assets/metro-x-bus.png" alt="" />
            <img class="logo" src="assets/metro-x-bus.png" alt="" />
            <img class="logo" src="assets/metro-x-bus.png" alt="" />
          </div>
          <div class="fare">ADULT ($3.00)</div>
        </button>

        <div class="divider"></div>
        <div class="band expiration">
          <div class="band-top yellow-top"></div>
          <div class="band-bottom yellow-bottom"></div>
          <div class="band-text">
            <div class="exp-time" id="expirationTime"></div>
            <div class="exp-label">Expiration Date &amp; Time</div>
          </div>
        </div>
      </section>
    </div>

    <script>
      const home = document.getElementById("home");
      const ticket = document.getElementById("ticket");
      const ticketArea = document.getElementById("ticketArea");
      const expirationTime = document.getElementById("expirationTime");

      function formatExpiration(date) {
        const mm = String(date.getMonth() + 1).padStart(2, "0");
        const dd = String(date.getDate()).padStart(2, "0");
        const yy = String(date.getFullYear()).slice(-2);
        let hours = date.getHours();
        const minutes = String(date.getMinutes()).padStart(2, "0");
        const ampm = hours >= 12 ? "PM" : "AM";
        hours = hours % 12;
        if (hours === 0) hours = 12;
        return mm + "/" + dd + "/" + yy + " " + hours + ":" + minutes + " " + ampm;
      }

      document.getElementById("openTicket").addEventListener("click", function () {
        // Expiration = now + 2.5 hours when the ticket is opened
        const expiresAt = new Date(Date.now() + 2.5 * 60 * 60 * 1000);
        expirationTime.textContent = formatExpiration(expiresAt);
        ticketArea.classList.remove("green");
        ticketArea.classList.add("blue");
        home.classList.remove("active");
        ticket.classList.add("active");
      });

      document.getElementById("backBtn").addEventListener("click", function () {
        ticket.classList.remove("active");
        home.classList.add("active");
      });

      // Tap ticket area: blue → green → blue
      ticketArea.addEventListener("click", function () {
        ticketArea.classList.toggle("green");
        ticketArea.classList.toggle("blue");
      });
    </script>
  </body>
</html>
